<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <alias>
    <family>FontAwesome</family>
    <prefer>
      <family>Font Awesome 7 Free Solid</family>
      <family>Font Awesome 7 Free</family>
      <family>JetBrainsMono Nerd Font</family>
    </prefer>
  </alias>
  <alias>
    <family>Font Awesome 5 Free</family>
    <prefer>
      <family>Font Awesome 7 Free Solid</family>
      <family>Font Awesome 7 Free</family>
      <family>JetBrainsMono Nerd Font</family>
    </prefer>
  </alias>
</fontconfig>
