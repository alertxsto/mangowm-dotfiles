# More option see https://github.com/DreamMaoMao/mango/wiki/
# Qt must resolve its palette from the KDE colour scheme (kdeglobals). The GTK
# platform-theme bridge only forwards the GTK theme, so Qt apps kept a palette
# unrelated to the wallpaper.
env=QT_QPA_PLATFORMTHEME,kde


# Window effect
blur=1
blur_layer=0
blur_optimized=1
blur_params_num_passes = 2
blur_params_radius = 5
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2

shadows = 0
layer_shadows = 0
shadow_only_floating = 1
shadows_size = 10
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0
shadowscolor= 0x000000ff

border_radius=2
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0

dim_enable=0
dim_focused_color=0x00000000
dim_unfocused_color=0x00000055

# Animation Configuration(support type:zoom,slide)
# tag_animation_direction: 1-horizontal,0-vertical
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
fadein_begin_opacity=0.5
fadeout_begin_opacity=0.8
animation_duration_move=500
animation_duration_open=260
animation_duration_tag=350
animation_duration_close=180
animation_duration_focus=0
animation_curve_open=0.22,1,0.36,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.4,0,0.2,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opafadeout=0.4,0,1,1
animation_curve_opafadein=0.22,1,0.36,1

# Scroller Layout Setting
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
edge_scroller_focus_allow_speed=0.0
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# Master-Stack Layout Setting
new_is_master=1
default_mfact=0.55
default_nmaster=1
tag_num=9
smartgaps=0

# Dwindle Layout Setting
dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_hsplit=1
dwindle_vsplit=1
dwindle_preserve_split=0

# Overview Setting
hotarea_size=10
enable_hotarea=0
hotarea_disable_on_fullscreen=1
overviewgappi=5
overviewgappo=30
overcircle_center_ratio=0.5

# Misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idleinhibit_ignore_visible=0
idleinhibit_when_fullscreen=0
sloppyfocus=1
warpcursor=1
focus_cross_monitor=0
focusdir_only_zone_overlap=1
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
float_full_to_top=0
cursor_size=24
drag_tile_to_tile=1
drag_tile_small=1

# keyboard
repeat_rate=25
repeat_delay=600
numlockon=0
xkb_rules_layout=us

# Trackpad
# need relogin to make it apply
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
trackpad_disable_while_typing=1
trackpad_left_handed=0
trackpad_middle_button_emulation=0
swipe_min_threshold=1

# mouse
# need relogin to make it apply
mouse_natural_scrolling=0

# Appearance
gappih=5
gappiv=5
gappoh=10
gappov=10
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
borderpx=2
# Colors generated from the active wallpaper by Matugen
source=~/.config/mango/colors.conf

# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
tagrule=id:1,layout_name:tile
tagrule=id:2,layout_name:tile
tagrule=id:3,layout_name:tile
tagrule=id:4,layout_name:tile
tagrule=id:5,layout_name:tile
tagrule=id:6,layout_name:tile
tagrule=id:7,layout_name:tile
tagrule=id:8,layout_name:tile
tagrule=id:9,layout_name:tile

# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none

# Regenerate the full desktop palette from the active wallpaper
bind=SUPER,r,spawn,$HOME/.local/bin/theme-wallpaper
bind=SUPER,w,spawn,$HOME/.local/bin/wallpaper-picker

# launcher, terminal, and file manager
bind=SUPER,d,spawn,rofi -show drun
bind=SUPER,Return,spawn,kitty
bind=SUPER,e,spawn,dolphin

# Hardware brightness and volume keys share the SwayNC backends and pop the
# same centered OSD.
bind=NONE,XF86MonBrightnessUp,spawn,$HOME/.local/bin/brightness-control up
bind=NONE,XF86MonBrightnessDown,spawn,$HOME/.local/bin/brightness-control down
bind=NONE,XF86AudioRaiseVolume,spawn,$HOME/.local/bin/volume-control up
bind=NONE,XF86AudioLowerVolume,spawn,$HOME/.local/bin/volume-control down
bind=NONE,XF86AudioMute,spawn,$HOME/.local/bin/volume-control mute

# exit
bind=SUPER,m,quit
bind=SUPER,q,killclient,

# Hyprland-style directional focus
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down

# swap window
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right

# switch window status
bind=SUPER,g,toggleglobal,
bind=ALT,Tab,togglejump,
bind=SUPER,v,togglefloating,
bind=ALT,a,togglemaximizescreen,
bind=SUPER,f,togglefullscreen,
bind=ALT+SHIFT,f,togglefakefullscreen,
bind=SUPER,i,minimized,
bind=SUPER,o,toggleoverlay,
bind=SUPER+SHIFT,I,restore_minimized
bind=ALT,z,toggle_scratchpad

# scroller layout
bind=ALT,e,set_proportion,1.0
bind=ALT,x,switch_proportion_preset,
bind=alt+super+ctrl,Left,scroller_stack,left
bind=alt+super+ctrl,Right,scroller_stack,right
bind=alt+super+ctrl,Up,scroller_stack,up
bind=alt+super+ctrl,Down,scroller_stack,down

#dwindle layout(manual split mode)
bind=alt+shift,Return,dwindle_toggle_split_direction

# switch layout
bind=SUPER,n,switch_layout

# Ctrl + arrows: switch to adjacent workspace, including empty ones
bind=CTRL,Left,viewtoleft,0
bind=CTRL,Right,viewtoright,0

# Super + number: switch tag; focused window stays put
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

# Super + Shift + number: move focused window and follow it
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# monitor switch
bind=alt+shift,Left,focusmon,left
bind=alt+shift,Right,focusmon,right
bind=SUPER+Alt,Left,tagmon,left
bind=SUPER+Alt,Right,tagmon,right

# gaps
bind=ALT+SHIFT,X,incgaps,1
bind=ALT+SHIFT,Z,incgaps,-1
bind=ALT+SHIFT,R,togglegaps

# movewin
bind=CTRL+SHIFT,Up,movewin,+0,-50
bind=CTRL+SHIFT,Down,movewin,+0,+50
bind=CTRL+SHIFT,Left,movewin,-50,+0
bind=CTRL+SHIFT,Right,movewin,+50,+0

# resizewin
bind=SUPER+CTRL,Up,resizewin,+0,-50
bind=SUPER+CTRL,Down,resizewin,+0,+50
bind=SUPER+CTRL,Left,resizewin,-50,+0
bind=SUPER+CTRL,Right,resizewin,+50,+0

# Mouse Button Bindings
# btn_left and btn_right can't bind none mod key
mousebind=SUPER,btn_left,moveresize,curmove
# Leave btn_middle unbound so applications receive middle-click drag (for example Blender orbit).
mousebind=SUPER,btn_right,moveresize,curresize


# Axis Bindings
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# Gesture Bindings
gesturebind=none,left,3,focusdir,left
gesturebind=none,right,3,focusdir,right
gesturebind=none,up,3,focusdir,up
gesturebind=none,down,3,focusdir,down
gesturebind=none,right,4,viewprev_have_client
gesturebind=none,left,4,viewnext_have_client
gesturebind=none,up,4,enteroverview
gesturebind=none,down,4,leaveoverview


# layer rule
layerrule=animation_type_open:slide,layer_name:rofi
layerrule=animation_type_close:slide,layer_name:rofi
# Native network popup: compositor slide plus automatic outside-click dismissal.
windowrule=isfloating:1,ignore_maximize:1,force_fakemaximize:0,isnoborder:1,isnoradius:1,isnoshadow:1,noblur:1,isnosizehint:1,width:420,height:510,offsetx:100,offsety:-100,animation_type_open:slide,animation_type_close:slide,appid:network-popup

# The OSD is a small floating overlay, never tiled, never bordered.
windowrule=isfloating:1,ignore_maximize:1,force_fakemaximize:0,isnoborder:1,isnoradius:1,isnoshadow:1,isnoanimation:1,noblur:1,isopensilent:1,width:356,height:86,offsetx:0,offsety:70,appid:mango-osd

# Session services
# D-Bus-activated KDE services (kiod6, xdg-desktop-portal-kde) take their
# environment from the bus, not from the compositor, so the platform theme has
# to be pushed there too or their Qt widgets fall back to Fusion.
exec-once=dbus-update-activation-environment QT_QPA_PLATFORMTHEME=kde
# Generate the theme before Waybar starts; theme-wallpaper signals running bars
# to reload, so launching both concurrently can terminate Waybar during startup.
exec-once=$HOME/.local/bin/theme-wallpaper; exec waybar
exec-once=$HOME/.local/bin/workspace-watch
exec-once=swaync
exec-once=$HOME/.local/bin/mango-osd --server
exec-once=/usr/lib/polkit-kde-authentication-agent-1
