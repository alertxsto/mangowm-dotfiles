# Generated by sync-shell-theme. Source: Matugen.
add_newline = true
command_timeout = 800
format = """[╭─](outline)$os$username$hostname$directory$git_branch$git_status$fill$cmd_duration$status$time
[╰─](outline)$character"""
palette = "matugen"

[palettes.matugen]
primary = "#ffb0d0"
on_primary = "#4c1833"
secondary = "#e1bdca"
tertiary = "#f1bb98"
error = "#ffb4ab"
surface = "#191114"
surface_high = "#332a2d"
on_surface = "#eedfe2"
muted = "#d4c2c7"
outline = "#66585d"

[os]
disabled = false
style = "bold primary"
format = "[$symbol]($style) "
[os.symbols]
Artix = "■"
Arch = "■"
Linux = "■"

[username]
show_always = true
style_user = "bold on_surface"
format = "[$user]($style)"
[hostname]
ssh_only = false
style = "muted"
format = "[@$hostname]($style) "
[directory]
style = "bold primary"
read_only = " 󰌾"
truncation_length = 3
truncate_to_repo = false
format = "[󰉋 $path]($style)[$read_only]($read_only_style) "
[directory.substitutions]
"Documents" = "󰈙 Documents"
"Downloads" = " Downloads"
"Pictures" = " Pictures"
"Projects" = "󰲋 Projects"

[git_branch]
symbol = " "
style = "tertiary"
format = "[$symbol$branch]($style) "
[git_status]
style = "secondary"
format = "[$all_status$ahead_behind]($style) "
[fill]
symbol = " "
[cmd_duration]
min_time = 1500
style = "muted"
format = "[󱎫 $duration]($style) "
[status]
disabled = false
style = "bold error"
format = "[$symbol$status]($style) "
symbol = "✘ "
[time]
disabled = false
time_format = "%H:%M"
style = "muted"
format = "[ $time]($style)"
[character]
success_symbol = "[❯](bold primary)"
error_symbol = "[❯](bold error)"
vimcmd_symbol = "[❮](bold secondary)"
