# Generated by sync-shell-theme. Source: Mango theme palette.
add_newline = true
command_timeout = 800
format = """[╭─](outline)$os$username$hostname$directory$git_branch$git_status$fill$cmd_duration$status$time
[╰─](outline)$character"""
palette = "mango"

[palettes.mango]
primary = "#b57614"
on_primary = "#fbf1c7"
secondary = "#8f3f71"
tertiary = "#427b58"
error = "#cc241d"
green = "#79740e"
yellow = "#b57614"
blue = "#076678"
magenta = "#8f3f71"
cyan = "#427b58"
surface = "#fbf1c7"
surface_high = "#d5c4a1"
on_surface = "#3c3836"
muted = "#665c54"
outline = "#bdae93"

[os]
disabled = false
style = "bold primary"
format = "[$symbol]($style) "
[os.symbols]
Artix = "■"
Arch = "■"
Linux = "■"

[username]
show_always = true
style_user = "bold on_surface"
format = "[$user]($style)"
[hostname]
ssh_only = false
style = "muted"
format = "[@$hostname]($style) "
[directory]
style = "bold primary"
read_only = " 󰌾"
truncation_length = 3
truncate_to_repo = false
format = "[󰉋 $path]($style)[$read_only]($read_only_style) "
[directory.substitutions]
"Documents" = "󰈙 Documents"
"Downloads" = " Downloads"
"Pictures" = " Pictures"
"Projects" = "󰲋 Projects"

[git_branch]
symbol = " "
style = "magenta"
format = "[$symbol$branch]($style) "
[git_status]
style = "cyan"
format = "[$all_status$ahead_behind]($style) "
[fill]
symbol = " "
[cmd_duration]
min_time = 1500
style = "muted"
format = "[󱎫 $duration]($style) "
[status]
disabled = false
style = "bold error"
format = "[$symbol$status]($style) "
symbol = "✘ "
[time]
disabled = false
time_format = "%H:%M"
style = "muted"
format = "[ $time]($style)"
[character]
success_symbol = "[❯](bold primary)"
error_symbol = "[❯](bold error)"
vimcmd_symbol = "[❮](bold secondary)"
